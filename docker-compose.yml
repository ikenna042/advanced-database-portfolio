# Core lab for the MIT 8103 portfolio. Portfolio 5 has its own replication and Citus clusters
# in portfolio-5-distributed-cloud/replication and /sharding.
# Ports are bound to localhost only and the passwords are for this local lab, not for real use.
name: kolaro-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kolaro
      POSTGRES_USER: kolaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kolaro-local-only}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolaro -d kolaro"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: kolaro
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-kolaro-local-only}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  mongo-data:
